name: CD Pipeline to Google Cloud Run
on:
  push:
    branches:
      - staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Autenticarse en Google Cloud con la llave JSON (El Robot entra a la oficina)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 3. Autenticarse en Docker Hub (El Robot entra al almacén)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Construir la imagen y subirla a Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # La etiqueta de la imagen será: usuario/proyecto:hash-corto-del-commit
          tags: ${{ secrets.DOCKER_USER }}/ci-cd-tutorial:${{ github.sha }}

      # 5. Desplegar en Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ci-cd-tutorial-service  # Nombre que tendrá el servicio en la nube
          image: ${{ secrets.DOCKER_USER }}/ci-cd-tutorial:${{ github.sha }}
          region: us-central1              # Región barata y estándar
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags: '--allow-unauthenticated' # IMPORTANTE: Para que pueda ver la web pública
          env_vars: |
            PORT=8080